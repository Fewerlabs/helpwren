packages:
  - "apps/*"
  - "packages/*"
  - "examples/nextjs"

catalog:
  "@types/node": ^26.0.0
  "@types/react": ^19.2.0
  "@types/react-dom": ^19.2.0
  eslint: ^9.39.5
  prettier: ^3.10.1
  prettier-plugin-tailwindcss: ^0.8.1
  react: ^19.3.1
  react-dom: ^19.3.1
  tailwindcss: ^4.3.5
  typescript: ~6.0.3
  vitest: ^5.1.1
  zod: ^4.6.7

minimumReleaseAgeExclude:
  - "@turbo/darwin-64@2.11.12"
  - "@turbo/darwin-arm64@2.11.12"
  - "@turbo/linux-64@2.11.12"
  - "@turbo/linux-arm64@2.11.12"
  - "@turbo/windows-64@2.11.12"
  - "@turbo/windows-arm64@2.11.12"
  - "@vitest/browser-playwright@5.1.1"
  - "@vitest/browser@5.1.1"
  - "@vitest/mocker@5.1.1"
  - "@vitest/pretty-format@5.1.1"
  - "@vitest/spy@5.1.1"
  - "@vitest/ui@5.1.1"
  - "@vitest/utils@5.1.1"
  - turbo@2.11.12
  - vitest@5.1.1
  - "@tanstack/query-core@5.108.0"
  - "@tanstack/react-query@5.108.0"

# Dependencies allowed to run install scripts. Everything else is blocked.
allowBuilds:
  esbuild: true

# Patched versions of two packages that only development tooling pulls in, until their parents
# ask for them: glob through Storybook's prop-table plugin (GHSA-3g3m-2fjr-6pw4), and minimatch
# through the shadcn CLI's ts-morph (GHSA-g3hv-75wg-m249). Neither runs in the app itself.
overrides:
  "@joshwooding/vite-plugin-react-docgen-typescript>glob": ^14.0.2
  "@ts-morph/common>minimatch": ^11.0.1
