name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium for story tests
        run: pnpm --filter @helpwren/design-system exec playwright install --with-deps chromium

      - run: pnpm format:check

      - name: Check commit messages
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

      - run: pnpm turbo run lint typecheck test build

  database:
    name: Database
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Studio and image resizing are only useful to a person at a browser, so CI skips them.
      - name: Start Supabase
        run: pnpm exec supabase start --exclude studio,imgproxy

      - name: Check the schema
        run: pnpm db:lint

      - name: Test the access rules
        run: pnpm db:test

      - name: Check the generated types are up to date
        run: pnpm db:types && git diff --exit-code packages/core/src/database.types.ts
