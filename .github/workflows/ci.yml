name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The app will not build without these. Nothing in this job connects to Supabase.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
      SUPABASE_SECRET_KEY: placeholder
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium for story tests
        run: pnpm --filter @helpwren/design-system exec playwright install --with-deps chromium

      - run: pnpm format:check

      - name: Check commit messages
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

      - name: Lint, typecheck, test and build
        shell: bash
        run: pnpm turbo run lint typecheck test build 2>&1 | tee turbo.log

      # Job logs need a sign-in to read; annotations do not. This puts the failing lines where
      # anyone can see them.
      - name: Report what failed
        if: failure()
        shell: bash
        run: |
          sed 's/\x1b\[[0-9;]*m//g' turbo.log \
            | grep -E 'FAIL|Error|error TS|✖|×|Timed out' \
            | head -10 \
            | while IFS= read -r line; do echo "::error::$line"; done

  database:
    name: Database
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Studio and image resizing are only useful to a person at a browser, so CI skips them.
      - name: Start Supabase
        run: pnpm exec supabase start --exclude studio,imgproxy

      - name: Check the schema
        run: pnpm db:lint

      - name: Test the access rules
        run: pnpm db:test

      - name: Test the client library and the API against the database
        run: pnpm test:db

      - name: Install Chromium for the browser tests
        run: pnpm --filter @helpwren/web exec playwright install --with-deps chromium

      - name: Test sign-in in a browser
        run: pnpm db:env && pnpm test:e2e

      - name: Check the generated types are up to date
        run: pnpm db:types && git diff --exit-code packages/core/src/database.types.ts
