name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. For security problems, do not open an issue; follow SECURITY.md instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps, or a link to a repository, that shows the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Helpwren version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Node version, browser and operating system, where relevant.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove any secrets or personal data first.
      render: shell
